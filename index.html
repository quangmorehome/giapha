.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.calh{font-size:.75rem;text-align:center;color:var(--muted)}.cd{min-height:58px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:.8rem;overflow:hidden}.cd .lun{display:block;color:var(--muted);font-size:.65rem}.cd.today{border:2px solid var(--accent)}.cd.empty{background:transparent;border-color:transparent}
i.dot,.legend .dot{display:inline-block;vertical-align:middle;margin-right:4px}.legend .dot{width:10px;height:10px}.dots{display:flex;gap:2px;flex-wrap:wrap}.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}.dot.gio{background:var(--accent)}.dot.sinh{background:var(--ok)}.dot.le{background:var(--gold)}

.tl{border-left:3px solid var(--gold);padding-left:14px;margin-left:6px}.tl li{margin-block:10px}.evd{font-weight:700;color:var(--accent)}

.hist li{padding:8px 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}.diff{font-size:.85rem;color:var(--muted)}
.kline,.kinres{padding:10px 12px;background:var(--surface2);border-radius:10px;margin-block:8px}.kline b{color:var(--accent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem;color:var(--muted);margin-block:6px}.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;border:1px solid var(--line);margin-right:4px}.sw.m{background:var(--m)}.sw.f{background:var(--f)}.sw.hid{background:var(--surface2);border-style:dashed}
.dgbox{height:min(70vh,640px);border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow:hidden;touch-action:none}.dg{display:block;cursor:grab;width:100%;height:100%}.dg.grab{cursor:grabbing}

.dg-n{fill:var(--fg);font:600 13px "Be Vietnam Pro",system-ui,sans-serif}.dg-s{fill:var(--muted);font:11px "Be Vietnam Pro",system-ui,sans-serif}.dg-l{stroke:var(--muted);stroke-width:1.5;fill:none}

/* ====== Chuyển động nhỏ (giống hiệu ứng PowerPoint: hiện lên, nảy, trượt) ====== */
@keyframes gp-rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes gp-pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes gp-bounce{0%,100%{transform:translateY(0)}30%{transform:translateY(-7px)}55%{transform:translateY(0)}75%{transform:translateY(-3px)}}
@keyframes gp-float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(.6deg)}}
@keyframes gp-sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes gp-slide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes gp-grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes gp-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes gp-draw{from{stroke-dashoffset:var(--len,600)}to{stroke-dashoffset:0}}
@keyframes gp-fade{from{opacity:0}to{opacity:1}}
@keyframes gp-drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@keyframes gp-shine{0%{background-position:-200% 0}100%{background-position:200% 0}}

main>h1{animation:gp-slide .5s cubic-bezier(.2,.8,.2,1) backwards}
main>p,main>.tabs,main>.row,main>.filters,main>.legend{animation:gp-fade .5s .1s backwards}
.card,.tile,.prow,.gitem,.finding,.kline,.kinres,.hist li,.tl li,.cd{animation:gp-rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 45ms)}
.tabs a{animation:gp-pop .45s cubic-bezier(.3,1.4,.5,1) backwards;animation-delay:calc(var(--i,0) * 55ms)}
.tile{transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}.tile:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 8px 18px color-mix(in srgb,var(--accent) 22%,transparent)}
.prow{transition:transform .2s cubic-bezier(.3,1.5,.5,1),border-color .2s,box-shadow .2s}.prow:hover{transform:translateX(6px);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 18%,transparent)}
.card{transition:box-shadow .25s,transform .25s}.card:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--fg) 12%,transparent)}
.gitem{transition:transform .25s cubic-bezier(.3,1.4,.5,1)}.gitem:hover{transform:translateY(-5px) rotate(-.6deg)}.gitem img{transition:transform .4s}.gitem:hover img{transform:scale(1.06)}
.btn{transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .2s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 5px 12px color-mix(in srgb,var(--accent) 25%,transparent)}.btn:active{transform:scale(.93);animation:gp-bounce .4s}
.btn.primary:hover{box-shadow:0 6px 16px color-mix(in srgb,var(--accent) 45%,transparent)}
.tabs a,.nav-list a{transition:transform .15s cubic-bezier(.3,1.6,.5,1),background .2s}.tabs a:hover,.nav-list a:hover{transform:translateY(-2px)}.tabs a:active,.nav-list a:active{transform:scale(.93)}
.nav-list a[aria-current=page]{animation:gp-pop .4s backwards}
.nav-list.open a{animation:gp-slide .35s backwards;animation-delay:calc(var(--k,0) * 25ms)}
.brand img{animation:gp-float 5s ease-in-out infinite;transform-origin:50% 90%}.brand:hover img{animation:gp-sway .6s ease-in-out 2}
.hero-logo,.hero img{animation:gp-float 6s ease-in-out infinite}
.badge{animation:gp-pop .4s backwards}
.big,.tile b{display:inline-block}
.cd.today{animation:gp-pulse 1.8s ease-out infinite}.cd{transition:transform .15s}.cd:not(.empty):hover{transform:scale(1.12);z-index:2;position:relative}
.dot{animation:gp-pop .4s .3s backwards}
ul.bars li{animation:gp-fade .4s backwards;animation-delay:calc(var(--i,0) * 50ms)}.bf{transform-origin:left center;animation:gp-grow .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 50ms + .15s)}
.tree li{animation:gp-slide .35s backwards}.tree li:nth-child(2){animation-delay:.04s}.tree li:nth-child(3){animation-delay:.08s}.tree li:nth-child(n+4){animation-delay:.12s}
.dg-card{transform-box:fill-box;transform-origin:center;animation:gp-pop .5s cubic-bezier(.3,1.4,.5,1) backwards}
.dg-n,.dg-s{animation:gp-fade .6s .2s backwards}
.dg-l{animation:gp-fade .8s .15s backwards}
.dg-card:hover{filter:drop-shadow(0 3px 5px color-mix(in srgb,var(--accent) 45%,transparent))}
.toast.show{animation:gp-bounce .5s}
.pk-list{animation:gp-drop .2s backwards}
.lightbox{animation:gp-fade .25s}.lightbox img{animation:gp-pop .35s backwards}
.finding.cao{animation:gp-rise .5s backwards,gp-pulse 2.4s 1s ease-out 2;animation-delay:calc(var(--i,0) * 45ms),calc(var(--i,0) * 45ms + 1s)}
.btn.primary{background-image:linear-gradient(110deg,transparent 30%,#fff3 50%,transparent 70%);background-size:250% 100%;background-repeat:no-repeat;background-position:-200% 0}.btn.primary:hover{animation:gp-shine .9s}
.hero{background:radial-gradient(ellipse at 50% 0,color-mix(in srgb,var(--gold) 18%,transparent),transparent 70%);border-radius:16px}
.top{box-shadow:0 2px 10px color-mix(in srgb,var(--fg) 10%,transparent)}

.no-motion *,.no-motion *::before,.no-motion *::after{animation:none!important;transition:none!important}

/* ====== Bảng màu thẻ thống kê ====== */
:root{--c1:#3b82f6;--c2:#ec4899;--c3:#f43f5e;--c4:#f59e0b;--c5:#10b981;--c6:#8b5cf6;--c7:#78716c;--c8:#d4a017}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c1:#60a5fa;--c2:#f472b6;--c3:#fb7185;--c4:#fbbf24;--c5:#34d399;--c6:#a78bfa;--c7:#a8a29e;--c8:#facc15}}
:root[data-theme="dark"]{--c1:#60a5fa;--c2:#f472b6;--c3:#fb7185;--c4:#fbbf24;--c5:#34d399;--c6:#a78bfa;--c7:#a8a29e;--c8:#facc15}
.c1{--c:var(--c1)}.c2{--c:var(--c2)}.c3{--c:var(--c3)}.c4{--c:var(--c4)}.c5{--c:var(--c5)}.c6{--c:var(--c6)}.c7{--c:var(--c7)}.c8{--c:var(--c8)}
.stiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px;margin-block:12px}
.st{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:14px;background:linear-gradient(145deg,color-mix(in srgb,var(--c) 16%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,var(--line));animation:gp-rise .5s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0) * 45ms);transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .2s}
.st:hover{transform:translateY(-4px) scale(1.03);box-shadow:0 8px 18px color-mix(in srgb,var(--c) 30%,transparent)}

.gfam .gft{font-weight:700}
.sheet-open body{overflow:hidden}
.sheet-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:16px;animation:gp-fade .18s ease-out}
.sheet{background:var(--bg);color:var(--fg);width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;border-radius:18px;border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.sheet-bar{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--surface)}.sheet-bar .grow{flex:1}
.sheet-body{overflow:auto;padding:12px 16px 20px;outline:none}
@keyframes gp-fade{from{opacity:0}to{opacity:1}}
@media (max-width:700px){.sheet-bg{padding:0;align-items:stretch}.sheet{border-radius:0;width:100%}}
.no-motion .sheet-bg{animation:none}

/* v1.9: bản công khai */
.banner.pub{background:var(--surface);color:var(--muted,var(--fg));font-size:.78rem}

/* v1.9: biểu mẫu thông minh, gọn nhẹ hơn trên điện thoại */
.auto{background:color-mix(in srgb,var(--gold) 16%,var(--surface))!important;box-shadow:0 0 0 2px color-mix(in srgb,var(--gold) 45%,transparent)}
.auto-note{font-size:.82rem;color:var(--ok);margin:4px 0 0;font-weight:600}
.filters.d3{grid-template-columns:repeat(3,minmax(0,1fr))}
details.old-names{margin-top:8px}details.old-names>summary{cursor:pointer;font-size:.88rem;color:var(--accent);font-weight:600;min-height:40px;display:flex;align-items:center}
details.old-names[hidden]{display:none}
@media(max-width:700px){
  .filters{grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
  .banner{font-size:.72rem;line-height:1.35;padding:5px 14px}
  .top-in{padding-block:4px;gap:6px}.brand img{height:36px}.brand-n{font-size:1.02rem}
  .tools{gap:5px;flex-wrap:nowrap;width:100%}.tools select{flex:1;min-width:0;max-width:130px}.tools .btn.small{padding-inline:10px;min-width:40px}
  .who{padding-block:2px;flex-wrap:nowrap}.who label{white-space:nowrap}.who select{flex:1;min-width:0}.who .who-n{display:none}
  .nav{padding-block:0}
}

/* v1.10: nội/ngoại tộc, bộ lọc gọn, nút xoá, dải đời trong sơ đồ */
.seg{display:inline-flex;border:1px solid var(--line,#d8d4c8);border-radius:999px;overflow:hidden;background:var(--surface,#fff)}
.segb{border:0;background:transparent;padding:.45rem .9rem;font:inherit;cursor:pointer;color:inherit;min-height:40px}
.segb.on{background:var(--accent,#9b2c2c);color:var(--accent-fg,#fff);font-weight:600}
.lrow{display:flex;flex-wrap:wrap;gap:.6rem 1rem;align-items:end;margin-top:.6rem}
.lrow>div{min-width:150px}
.morefl{margin-top:.6rem}.morefl>summary,.fltbar>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:.4rem;min-height:36px}
.morefl>summary::-webkit-details-marker,.fltbar>summary::-webkit-details-marker{display:none}
.morefl>summary::before,.fltbar>summary::before{content:"▸";transition:transform .15s}
.morefl[open]>summary::before,.fltbar[open]>summary::before{transform:rotate(90deg)}
.nbadge{background:var(--accent,#9b2c2c);color:var(--accent-fg,#fff);border-radius:999px;font-size:.75rem;padding:0 .5rem;min-width:1.2rem;text-align:center}
.fltbar .fpills{margin-top:.5rem}
.plist li.gsec{position:sticky;top:0;z-index:2;display:flex;flex-direction:column;padding:.55rem .8rem;margin:.9rem 0 .2rem;border-radius:10px;background:var(--accent,#9b2c2c);color:var(--accent-fg,#fff);font-size:1.05rem}
.plist li.gsec.ngoai{background:var(--ok,#2f6b3c);color:var(--accent-fg,#fff)}
.plist li.gsec small{opacity:.85;font-size:.8rem}
.plist li{position:relative}
.rowdel{position:absolute;right:.4rem;top:.4rem;border:0;background:transparent;cursor:pointer;font-size:1rem;opacity:.45;padding:.35rem;border-radius:8px}
.rowdel:hover,.rowdel:focus-visible{opacity:1;background:rgba(160,30,30,.12)}
.btn.danger{background:var(--bad-bg,#fde4e1);border:1px solid var(--bad,#a12a2a);color:var(--bad,#a12a2a)}
.sheet-bg.ask{z-index:80}.askbox{max-width:460px;margin:auto;padding:1.2rem}
.crumbs{display:flex;flex-wrap:wrap;gap:.3rem;align-items:center}
.crumb{border:1px solid var(--line,#d8d4c8);background:transparent;border-radius:999px;padding:.25rem .7rem;cursor:pointer;font:inherit;color:inherit}
.crumb.on{background:var(--accent,#9b2c2c);color:var(--accent-fg,#fff);border-color:transparent}
.crumb small{opacity:.7}.crumbs .sep{opacity:.5}
.gband{fill:rgba(120,110,90,.05)}.gband.alt{fill:rgba(120,110,90,.11)}
.glab{fill:var(--muted,#7a7468);font-size:12px;font-weight:600;paint-order:stroke;stroke:var(--bg,#fff);stroke-width:3px}
.gring{fill:none;stroke:rgba(120,110,90,.3);stroke-dasharray:4 6}

/* v1.13: đăng nhập đám mây */
.cloudbar{display:flex;flex-wrap:wrap;gap:.5rem 1rem;align-items:center;padding-block:.4rem}
.cloudlogin summary{cursor:pointer;font-weight:600}
.cloudlogin form{margin-top:.4rem;gap:.5rem}.cloudlogin input{min-width:180px}
.cl-st{font-size:.9rem;color:var(--muted,#7a7468)}.cl-st.bad{color:var(--bad,#a12a2a);font-weight:600}

/* v1.15: giao diện mới — dải hoạ tiết, menu có biểu tượng, đăng nhập, thẻ nổi nhẹ */
:root{--grad1:#fffdf7;--grad2:#f6ecd6;--shadow:0 1px 2px rgba(60,40,20,.08),0 6px 18px rgba(60,40,20,.07);--shadow-up:0 2px 4px rgba(60,40,20,.1),0 12px 28px rgba(60,40,20,.13);--chip-admin:#7a1f1f;--chip-admin-fg:#fff6ea;--chip-editor:#245a8a;--chip-editor-fg:#eef6ff;--dot-ok:#2f8f4e;--dot-busy:#c58a12;--dot-bad:#c0392b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--grad1:#241c15;--grad2:#1b1510;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow-up:0 2px 4px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.5);--chip-admin:#e8a090;--chip-admin-fg:#2a100b;--chip-editor:#8ec1ee;--chip-editor-fg:#0d1c2b;--dot-ok:#5fd085;--dot-busy:#e6b04a;--dot-bad:#ff8b7b}}
:root[data-theme="dark"]{--grad1:#241c15;--grad2:#1b1510;--shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35);--shadow-up:0 2px 4px rgba(0,0,0,.5),0 12px 28px rgba(0,0,0,.5);--chip-admin:#e8a090;--chip-admin-fg:#2a100b;--chip-editor:#8ec1ee;--chip-editor-fg:#0d1c2b;--dot-ok:#5fd085;--dot-busy:#e6b04a;--dot-bad:#ff8b7b}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.22em}
.top{position:relative;background:linear-gradient(180deg,var(--grad1),var(--grad2));border-bottom:3px solid var(--gold);box-shadow:var(--shadow)}
.top::before{content:"";display:block;height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 22px,var(--gold) 22px 28px,var(--accent) 28px 50px,transparent 50px 56px);opacity:.9}
.brand img{filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));border-radius:6px}
.brand-n{letter-spacing:.2px;font-size:1.25rem}
.tools .btn.small{border-radius:999px}.themebtn .i-moon{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:none}:root[data-theme="dark"] .themebtn .i-moon{display:inline}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .themebtn .i-sun{display:none}:root:not([data-theme="light"]) .themebtn .i-moon{display:inline}}
.nav{background:var(--surface2);box-shadow:0 2px 6px rgba(0,0,0,.05)}
.nav-list a{display:flex;align-items:center;gap:7px;border-radius:999px;font-weight:600;transition:background .15s,transform .15s}
.nav-list a:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.nav-list a[aria-current=page]{box-shadow:0 2px 8px color-mix(in srgb,var(--accent) 45%,transparent)}
.nav-list a .ico{opacity:.9}
.tabs a{border-radius:999px}
.card{box-shadow:var(--shadow);transition:box-shadow .2s,transform .2s}
a.card:hover,.tile:hover,.card.link:hover{box-shadow:var(--shadow-up);transform:translateY(-2px)}
main h1{position:relative;padding-bottom:.35em}
main h1::after{content:"";display:block;width:64px;height:4px;margin-top:.35em;border-radius:4px;background:linear-gradient(90deg,var(--accent),var(--gold))}
.btn{border-radius:10px;transition:background .15s,box-shadow .15s,transform .1s}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));box-shadow:0 2px 6px color-mix(in srgb,var(--accent) 40%,transparent)}
.btn.primary:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
/* đăng nhập */
.cloudbar{gap:.6rem 1rem}
.avatar{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--gold));color:var(--accent-fg);font-weight:700;box-shadow:var(--shadow)}
.who-name{display:inline-flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 10px;border-radius:999px;font-size:.78rem;font-weight:700}
.chip.role-admin{background:var(--chip-admin);color:var(--chip-admin-fg)}.chip.role-editor{background:var(--chip-editor);color:var(--chip-editor-fg)}
.cl-st::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;background:var(--dot-ok);vertical-align:baseline}
.cl-st.dot-busy::before{background:var(--dot-busy);animation:gp-pulse 1s infinite}.cl-st.dot-bad::before{background:var(--dot-bad)}
@keyframes gp-pulse{50%{opacity:.3}}@media (prefers-reduced-motion:reduce){.cl-st.dot-busy::before{animation:none}}
.logout{margin-left:auto}
.cloudlogin{position:relative}.cloudlogin summary{list-style:none;cursor:pointer;background:var(--accent);color:var(--accent-fg);border-color:transparent}
.cloudlogin summary::-webkit-details-marker{display:none}
.loginform{position:absolute;z-index:40;left:0;top:calc(100% + 8px);width:min(340px,calc(100vw - 32px));display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow-up)}
.lf-head{display:flex;align-items:center;gap:8px;color:var(--accent);font-family:"Lora",Georgia,serif;font-size:1.05rem}
.fld{position:relative;display:block}.fld>.ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.fld input{width:100%;padding-left:38px;padding-right:44px;min-width:0}
.fld .eye{position:absolute;right:2px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;color:var(--muted);cursor:pointer;border-radius:8px;display:grid;place-items:center}
.fld .eye[aria-pressed=true]{color:var(--accent)}
.who{background:transparent}
/* chân trang */
.foot{background:linear-gradient(180deg,var(--grad2),var(--surface2));border-top:3px solid var(--gold)}
.hero h1::after,main h1.c::after,.center h1::after{margin-inline:auto}
.cloudlogin summary:hover,.cloudlogin[open] summary,.cloudlogin summary:focus-visible{background:var(--accent);color:var(--accent-fg);filter:brightness(1.1)}

/* v1.18 · Hình nền phong cảnh làng quê */
:root{--sc-sun:#e9b44c;--sc-sun2:rgba(233,180,76,.25);--sc-far:#c9d3b0;--sc-mid:#b3c48f;--sc-near:#9db477;--sc-ink:#6b4a2f;--sc-door:#3b2616;--sc-leaf:#7fa05a;--sc-line:rgba(255,255,255,.35);--sc-lotus:#e58aa6;--sc-op:.42}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sc-sun:#e8d9a0;--sc-sun2:rgba(232,217,160,.12);--sc-far:#27332a;--sc-mid:#202b21;--sc-near:#1a241b;--sc-ink:#3a2c20;--sc-door:#0f0b08;--sc-leaf:#2c4430;--sc-line:rgba(255,255,255,.06);--sc-lotus:#8a4a5e;--sc-op:.5}}
:root[data-theme="dark"]{--sc-sun:#e8d9a0;--sc-sun2:rgba(232,217,160,.12);--sc-far:#27332a;--sc-mid:#202b21;--sc-near:#1a241b;--sc-ink:#3a2c20;--sc-door:#0f0b08;--sc-leaf:#2c4430;--sc-line:rgba(255,255,255,.06);--sc-lotus:#8a4a5e;--sc-op:.5}
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:var(--sc-op);transition:opacity .4s}
#scene svg{position:absolute;left:0;bottom:0;width:100%;height:min(70vh,640px)}
body>header,body>main,body>footer,.wrap{position:relative;z-index:1}
#scene .s-sun{fill:var(--sc-sun)}#scene .s-sun2{fill:var(--sc-sun2)}#scene .s-far{fill:var(--sc-far)}#scene .s-mid{fill:var(--sc-mid)}#scene .s-near{fill:var(--sc-near)}
#scene .s-ink{fill:var(--sc-ink);stroke:var(--sc-ink)}#scene .s-door{fill:var(--sc-door)}#scene .s-leaf{fill:var(--sc-leaf)}#scene .s-lotus{fill:var(--sc-lotus)}#scene .s-line{fill:none;stroke:var(--sc-line);stroke-width:2}
@media print{#scene{display:none}}
